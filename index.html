<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Holy Land Public School</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
    }

    .header {
      background: #075985;
      color: white;
      padding: 20px;
      text-align: center;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .card {
      max-width: 700px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.1);
    }

    input, textarea, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      background: #075985;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #0c4a6e;
    }

    .danger {
      background: #dc2626;
    }

    .secondary {
      background: #64748b;
    }

    .notice-item {
      border: 1px solid #ddd;
      padding: 15px;
      margin: 12px 0;
      border-radius: 10px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
    }

    .hidden {
      display: none;
    }

    .debug {
      background: #fff7ed;
      color: #9a3412;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 14px;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="header">
  <h1>HOLY LAND PUBLIC SCHOOL</h1>
  <p>Admin Panel - Notice Board</p>
</div>

<!-- LOGIN -->
<div id="loginBox" class="card">
  <h2>Admin Login</h2>

  <input
    type="email"
    id="email"
    placeholder="Admin Email"
    autocomplete="email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button type="button" onclick="loginAdmin()">Login</button>

  <div id="loginMessage"></div>

  <div id="debugBox" class="debug">
    Checking system...
  </div>
</div>


<!-- ADMIN PANEL -->
<div id="adminBox" class="card hidden">

  <h2>Notice Management</h2>

  <button type="button" class="secondary" onclick="logoutAdmin()">
    Logout
  </button>

  <hr>

  <h3>Add / Edit Notice</h3>

  <input type="hidden" id="noticeId">

  <input
    type="text"
    id="title"
    placeholder="Notice Title"
  >

  <textarea
    id="message"
    rows="4"
    placeholder="Notice Message"
  ></textarea>

  <select id="type">
    <option value="notice">Notice</option>
    <option value="holiday">Holiday</option>
    <option value="admission">Admission</option>
    <option value="important">Important</option>
  </select>

  <input
    type="date"
    id="noticeDate"
  >

  <input
    type="text"
    id="link"
    placeholder="Optional Link"
  >

  <label>
    <input
      type="checkbox"
      id="active"
      checked
      style="width:auto;"
    >
    Active
  </label>

  <button type="button" onclick="saveNotice()">
    Save Notice
  </button>

  <button
    type="button"
    class="secondary"
    onclick="clearForm()"
  >
    Clear
  </button>

  <div id="noticeMessage"></div>

  <hr>

  <h3>All Notices</h3>

  <div id="noticeList">
    Loading...
  </div>

</div>


<script>

function showMessage(id, message, type) {
  const box = document.getElementById(id);

  if (!box) return;

  box.className = type || "";
  box.innerHTML = message;
}


/* SYSTEM CHECK */
window.addEventListener("load", async function () {

  const debug = document.getElementById("debugBox");

  let messages = [];

  if (window.supabase) {
    messages.push("✅ Supabase library loaded");
  } else {
    messages.push("❌ Supabase library NOT loaded");
  }

  if (typeof supabaseClient !== "undefined") {
    messages.push("✅ supabase-config.js loaded");
  } else {
    messages.push("❌ supabase-config.js NOT loaded");
  }

  if (typeof supabaseClient !== "undefined") {
    try {
      const result = await supabaseClient.auth.getSession();

      if (result.error) {
        messages.push(
          "❌ Supabase connection error: " +
          result.error.message
        );
      } else {
        messages.push("✅ Supabase connection working");

        if (result.data.session) {
          messages.push("✅ Existing login session found");

          document.getElementById("loginBox").classList.add("hidden");
          document.getElementById("adminBox").classList.remove("hidden");

          loadNotices();
        } else {
          messages.push("ℹ️ No login session");
        }
      }

    } catch (error) {
      messages.push(
        "❌ ERROR: " +
        error.message
      );
    }
  }

  debug.innerHTML = messages.join("<br>");
});


/* LOGIN */
async function loginAdmin() {

  showMessage(
    "loginMessage",
    "Login checking...",
    ""
  );

  if (!window.supabase) {
    showMessage(
      "loginMessage",
      "❌ Supabase library load नहीं हुई।",
      "error"
    );
    return;
  }

  if (typeof supabaseClient === "undefined") {
    showMessage(
      "loginMessage",
      "❌ supabase-config.js load नहीं हुई।",
      "error"
    );
    return;
  }

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email || !password) {
    showMessage(
      "loginMessage",
      "❌ Email और Password डालें।",
      "error"
    );
    return;
  }

  try {

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      showMessage(
        "loginMessage",
        "❌ Login Error: " +
        error.message,
        "error"
      );

      return;
    }

    if (!data.session) {

      showMessage(
        "loginMessage",
        "❌ Login हुआ लेकिन session नहीं मिला।",
        "error"
      );

      return;
    }

    showMessage(
      "loginMessage",
      "✅ Login successful!",
      "success"
    );

    document.getElementById("loginBox")
      .classList.add("hidden");

    document.getElementById("adminBox")
      .classList.remove("hidden");

    loadNotices();

  } catch (error) {

    showMessage(
      "loginMessage",
      "❌ JavaScript Error: " +
      error.message,
      "error"
    );
  }
}


/* LOGOUT */
async function logoutAdmin() {

  try {
    await supabaseClient.auth.signOut();

    document.getElementById("adminBox")
      .classList.add("hidden");

    document.getElementById("loginBox")
      .classList.remove("hidden");

    showMessage(
      "loginMessage",
      "Logged out.",
      "success"
    );

  } catch (error) {

    showMessage(
      "loginMessage",
      "❌ " + error.message,
      "error"
    );
  }
}


/* SAVE NOTICE */
async function saveNotice() {

  const id =
    document.getElementById("noticeId").value;

  const title =
    document.getElementById("title").value.trim();

  const message =
    document.getElementById("message").value.trim();

  const type =
    document.getElementById("type").value;

  const noticeDate =
    document.getElementById("noticeDate").value || null;

  const link =
    document.getElementById("link").value.trim();

  const active =
    document.getElementById("active").checked;

  if (!title || !message) {

    showMessage(
      "noticeMessage",
      "❌ Title और Message जरूरी है।",
      "error"
    );

    return;
  }

  try {

    let result;

    if (id) {

      result = await supabaseClient
        .from("notifications")
        .update({
          title: title,
          message: message,
          type: type,
          notice_date: noticeDate,
          link: link,
          active: active
        })
        .eq("id", id);

    } else {

      result = await supabaseClient
        .from("notifications")
        .insert({
          title: title,
          message: message,
          type: type,
          notice_date: noticeDate,
          link: link,
          active: active
        });
    }

    if (result.error) {

      showMessage(
        "noticeMessage",
        "❌ " + result.error.message,
        "error"
      );

      return;
    }

    showMessage(
      "noticeMessage",
      "✅ Notice saved successfully.",
      "success"
    );

    clearForm();
    loadNotices();

  } catch (error) {

    showMessage(
      "noticeMessage",
      "❌ " + error.message,
      "error"
    );
  }
}


/* LOAD NOTICES */
async function loadNotices() {

  const list =
    document.getElementById("noticeList");

  list.innerHTML = "Loading...";

  try {

    const { data, error } =
      await supabaseClient
        .from("notifications")
        .select("*")
        .order("created_at", {
          ascending: false
        });

    if (error) {

      list.innerHTML =
        '<div class="error">❌ ' +
        error.message +
        '</div>';

      return;
    }

    if (!data || data.length === 0) {

      list.innerHTML =
        "<p>No notices found.</p>";

      return;
    }

    list.innerHTML = data.map(function(notice) {

      return `
        <div class="notice-item">

          <h3>${escapeHtml(notice.title || "")}</h3>

          <p>${escapeHtml(notice.message || "")}</p>

          <p>
            <strong>Type:</strong>
            ${escapeHtml(notice.type || "")}
          </p>

          <p>
            <strong>Date:</strong>
            ${escapeHtml(notice.notice_date || "Not set")}
          </p>

          <p>
            <strong>Status:</strong>
            ${notice.active ? "🟢 Active" : "🔴 Inactive"}
          </p>

          <button
            type="button"
            onclick="editNotice('${notice.id}')"
          >
            Edit
          </button>

          <button
            type="button"
            onclick="toggleNotice('${notice.id}', ${notice.active})"
          >
            ${notice.active ? "Deactivate" : "Activate"}
          </button>

          <button
            type="button"
            class="danger"
            onclick="deleteNotice('${notice.id}')"
          >
            Delete
          </button>

        </div>
      `;

    }).join("");

  } catch (error) {

    list.innerHTML =
      '<div class="error">❌ ' +
      error.message +
      '</div>';
  }
}


/* EDIT */
async function editNotice(id) {

  try {

    const { data, error } =
      await supabaseClient
        .from("notifications")
        .select("*")
        .eq("id", id)
        .single();

    if (error) {
      alert(error.message);
      return;
    }

    document.getElementById("noticeId").value =
      data.id || "";

    document.getElementById("title").value =
      data.title || "";

    document.getElementById("message").value =
      data.message || "";

    document.getElementById("type").value =
      data.type || "notice";

    document.getElementById("noticeDate").value =
      data.notice_date || "";

    document.getElementById("link").value =
      data.link || "";

    document.getElementById("active").checked =
      data.active === true;

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  } catch (error) {

    alert(error.message);
  }
}


/* TOGGLE */
async function toggleNotice(id, currentStatus) {

  try {

    const { error } =
      await supabaseClient
        .from("notifications")
        .update({
          active: !currentStatus
        })
        .eq("id", id);

    if (error) {

      alert(error.message);
      return;
    }

    loadNotices();

  } catch (error) {

    alert(error.message);
  }
}


/* DELETE */
async function deleteNotice(id) {

  if (!confirm("Delete this notice?")) {
    return;
  }

  try {

    const { error } =
      await supabaseClient
        .from("notifications")
        .delete()
        .eq("id", id);

    if (error) {

      alert(error.message);
      return;
    }

    loadNotices();

  } catch (error) {

    alert(error.message);
  }
}


/* CLEAR */
function clearForm() {

  document.getElementById("noticeId").value = "";
  document.getElementById("title").value = "";
  document.getElementById("message").value = "";
  document.getElementById("type").value = "notice";
  document.getElementById("noticeDate").value = "";
  document.getElementById("link").value = "";
  document.getElementById("active").checked = true;
}


/* ESCAPE HTML */
function escapeHtml(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

</script>

</body>
</html>
