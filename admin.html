<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holy Land Public School - Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #222;
    }

    .header {
      background: #123b6d;
      color: white;
      padding: 18px 15px;
      text-align: center;
    }

    .header h1 {
      margin: 0 0 6px;
      font-size: 22px;
    }

    .header p {
      margin: 0;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #123b6d;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 14px 0 6px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd3dc;
      border-radius: 7px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .btn {
      border: 0;
      border-radius: 7px;
      padding: 11px 16px;
      font-size: 14px;
      cursor: pointer;
      margin: 6px 4px 0 0;
    }

    .btn-primary {
      background: #123b6d;
      color: white;
    }

    .btn-success {
      background: #168447;
      color: white;
    }

    .btn-danger {
      background: #c62828;
      color: white;
    }

    .btn-secondary {
      background: #e5e9ee;
      color: #222;
    }

    .btn-warning {
      background: #e59b00;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .message {
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 15px;
      display: none;
    }

    .message.success {
      display: block;
      background: #e8f7ed;
      color: #146c35;
    }

    .message.error {
      display: block;
      background: #fdecec;
      color: #a21d1d;
    }

    .login-box {
      max-width: 450px;
      margin: 50px auto;
    }

    .notice-item {
      border: 1px solid #dce2e8;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .notice-item.inactive {
      opacity: 0.6;
      background: #f5f5f5;
    }

    .notice-title {
      font-size: 18px;
      font-weight: bold;
      color: #123b6d;
      margin-bottom: 7px;
    }

    .notice-message {
      white-space: pre-wrap;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .notice-meta {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }

    .status {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .status.active {
      background: #dff5e7;
      color: #16743a;
    }

    .status.inactive {
      background: #eee;
      color: #666;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .topbar h2 {
      margin: 0;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
    }

    .checkbox-row input {
      width: auto;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    @media (max-width: 600px) {
      .container {
        margin: 15px auto;
      }

      .card {
        padding: 15px;
      }

      .header h1 {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>HOLY LAND PUBLIC SCHOOL</h1>
    <p>Admin Panel - Notice Board</p>
  </div>

  <!-- LOGIN -->
  <div id="loginSection" class="container">
    <div class="card login-box">
      <h2>Admin Login</h2>

      <div id="loginMessage" class="message"></div>

      <label for="loginEmail">Email</label>
      <input
        type="email"
        id="loginEmail"
        placeholder="Admin email"
        autocomplete="email"
      >

      <label for="loginPassword">Password</label>
      <input
        type="password"
        id="loginPassword"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button class="btn btn-primary" onclick="loginAdmin()">
        Login
      </button>
    </div>
  </div>


  <!-- ADMIN PANEL -->
  <div id="adminSection" class="container hidden">

    <div class="card">
      <div class="topbar">
        <h2>Notice Management</h2>
        <button class="btn btn-danger" onclick="logoutAdmin()">
          Logout
        </button>
      </div>

      <p style="color:#666;">
        यहाँ से आप स्कूल की छुट्टी, admission, event और दूसरी सभी notices
        जोड़, बदल या बंद कर सकते हैं।
      </p>
    </div>


    <!-- ADD / EDIT NOTICE -->
    <div class="card">

      <h2 id="formHeading">Add New Notice</h2>

      <div id="formMessage" class="message"></div>

      <input type="hidden" id="editId">

      <label for="noticeTitle">Notice Title *</label>
      <input
        type="text"
        id="noticeTitle"
        placeholder="जैसे: School Holiday"
      >

      <label for="noticeMessage">Notice Message *</label>
      <textarea
        id="noticeMessage"
        placeholder="जैसे: दिनांक 2 अक्टूबर को गांधी जयंती के अवसर पर विद्यालय बंद रहेगा।"
      ></textarea>

      <label for="noticeType">Notice Type</label>
      <select id="noticeType">
        <option value="general">📢 General</option>
        <option value="holiday">📅 Holiday</option>
        <option value="admission">🎓 Admission</option>
        <option value="event">🎉 Event</option>
        <option value="urgent">🚨 Urgent</option>
      </select>

      <label for="noticeDate">Notice Date</label>
      <input type="date" id="noticeDate">

      <label for="noticeLink">Link (optional)</label>
      <input
        type="url"
        id="noticeLink"
        placeholder="https://example.com"
      >

      <div class="checkbox-row">
        <input type="checkbox" id="noticeActive" checked>
        <label for="noticeActive" style="margin:0;">
          Website पर दिखाएँ
        </label>
      </div>

      <div style="margin-top:15px;">
        <button class="btn btn-success" onclick="saveNotice()">
          Save Notice
        </button>

        <button
          class="btn btn-secondary hidden"
          id="cancelEditBtn"
          onclick="cancelEdit()"
        >
          Cancel Edit
        </button>
      </div>

    </div>


    <!-- NOTICE LIST -->
    <div class="card">

      <div class="topbar">
        <h2>All Notices</h2>

        <button class="btn btn-secondary" onclick="loadNotices()">
          Refresh
        </button>
      </div>

      <div id="noticeList">
        <div class="empty">Loading notices...</div>
      </div>

    </div>

  </div>


<script>

  let editingId = null;


  // Show message
  function showMessage(elementId, text, type) {
    const el = document.getElementById(elementId);

    el.textContent = text;
    el.className = "message " + type;

    setTimeout(() => {
      el.className = "message";
      el.textContent = "";
    }, 5000);
  }


  // Check login when page opens
  async function checkLogin() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (session) {
      showAdminPanel();
    } else {
      showLogin();
    }
  }


  function showAdminPanel() {
    document.getElementById("loginSection").classList.add("hidden");
    document.getElementById("adminSection").classList.remove("hidden");

    loadNotices();
  }


  function showLogin() {
    document.getElementById("loginSection").classList.remove("hidden");
    document.getElementById("adminSection").classList.add("hidden");
  }


  // Login
  async function loginAdmin() {

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    if (!email || !password) {
      showMessage(
        "loginMessage",
        "Email और password दोनों भरें।",
        "error"
      );
      return;
    }

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      showMessage(
        "loginMessage",
        "Login failed: " + error.message,
        "error"
      );

      return;
    }

    showAdminPanel();
  }


  // Logout
  async function logoutAdmin() {

    await supabaseClient.auth.signOut();

    editingId = null;

    showLogin();

    document.getElementById("loginPassword").value = "";
  }


  // Load all notices
  async function loadNotices() {

    const list = document.getElementById("noticeList");

    list.innerHTML =
      '<div class="empty">Loading notices...</div>';

    const { data, error } = await supabaseClient
      .from("notifications")
      .select("*")
      .order("notice_date", {
        ascending: false
      })
      .order("created_at", {
        ascending: false
      });

    if (error) {

      list.innerHTML =
        '<div class="empty">Notices load नहीं हो सकीं: ' +
        escapeHtml(error.message) +
        '</div>';

      return;
    }

    if (!data || data.length === 0) {

      list.innerHTML =
        '<div class="empty">अभी कोई notice नहीं है।</div>';

      return;
    }

    list.innerHTML = data
      .map(notice => createNoticeHTML(notice))
      .join("");
  }


  // Create notice HTML
  function createNoticeHTML(notice) {

    const typeIcons = {
      general: "📢",
      holiday: "📅",
      admission: "🎓",
      event: "🎉",
      urgent: "🚨"
    };

    const icon =
      typeIcons[notice.type] || "📢";

    const statusClass =
      notice.active ? "active" : "inactive";

    const statusText =
      notice.active ? "ACTIVE" : "INACTIVE";

    let dateText = "";

    if (notice.notice_date) {

      const d =
        new Date(notice.notice_date + "T00:00:00");

      dateText =
        d.toLocaleDateString("en-IN", {
          day: "2-digit",
          month: "long",
          year: "numeric"
        });
    }

    return `
      <div class="notice-item ${notice.active ? "" : "inactive"}">

        <div>
          <span class="status ${statusClass}">
            ${statusText}
          </span>
        </div>

        <div class="notice-title">
          ${icon} ${escapeHtml(notice.title || "")}
        </div>

        <div class="notice-message">
          ${escapeHtml(notice.message || "")}
        </div>

        ${
          dateText
            ? `<div class="notice-meta">
                📅 Date: ${escapeHtml(dateText)}
               </div>`
            : ""
        }

        ${
          notice.link
            ? `<div class="notice-meta">
                🔗 Link: ${escapeHtml(notice.link)}
               </div>`
            : ""
        }

        <div>

          <button
            class="btn btn-primary"
            onclick="editNotice('${notice.id}')"
          >
            Edit
          </button>

          <button
            class="btn btn-warning"
            onclick="toggleNotice('${notice.id}', ${notice.active})"
          >
            ${notice.active ? "Deactivate" : "Activate"}
          </button>

          <button
            class="btn btn-danger"
            onclick="deleteNotice('${notice.id}')"
          >
            Delete
          </button>

        </div>

      </div>
    `;
  }


  // Escape HTML
  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  // Save new or edited notice
  async function saveNotice() {

    const title =
      document.getElementById("noticeTitle").value.trim();

    const message =
      document.getElementById("noticeMessage").value.trim();

    const type =
      document.getElementById("noticeType").value;

    const notice_date =
      document.getElementById("noticeDate").value || null;

    const link =
      document.getElementById("noticeLink").value.trim() || null;

    const active =
      document.getElementById("noticeActive").checked;


    if (!title || !message) {

      showMessage(
        "formMessage",
        "Title और Message भरना जरूरी है।",
        "error"
      );

      return;
    }


    let result;


    if (editingId) {

      result = await supabaseClient
        .from("notifications")
        .update({
          title: title,
          message: message,
          type: type,
          notice_date: notice_date,
          link: link,
          active: active
        })
        .eq("id", editingId);

    } else {

      result = await supabaseClient
        .from("notifications")
        .insert({
          title: title,
          message: message,
          type: type,
          notice_date: notice_date,
          link: link,
          active: active
        });
    }


    if (result.error) {

      showMessage(
        "formMessage",
        "Save failed: " + result.error.message,
        "error"
      );

      return;
    }


    showMessage(
      "formMessage",
      editingId
        ? "Notice successfully updated! ✅"
        : "Notice successfully added! ✅",
      "success"
    );


    clearForm();

    loadNotices();
  }


  // Edit notice
  async function editNotice(id) {

    const { data, error } = await supabaseClient
      .from("notifications")
      .select("*")
      .eq("id", id)
      .single();


    if (error || !data) {

      alert(
        "Notice नहीं मिल सकी: " +
        (error ? error.message : "")
      );

      return;
    }


    editingId = id;


    document.getElementById("noticeTitle").value =
      data.title || "";

    document.getElementById("noticeMessage").value =
      data.message || "";

    document.getElementById("noticeType").value =
      data.type || "general";

    document.getElementById("noticeDate").value =
      data.notice_date || "";

    document.getElementById("noticeLink").value =
      data.link || "";

    document.getElementById("noticeActive").checked =
      data.active !== false;


    document.getElementById("formHeading").textContent =
      "Edit Notice";

    document.getElementById("cancelEditBtn")
      .classList.remove("hidden");


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  // Cancel editing
  function cancelEdit() {

    clearForm();
  }


  function clearForm() {

    editingId = null;

    document.getElementById("noticeTitle").value = "";
    document.getElementById("noticeMessage").value = "";
    document.getElementById("noticeType").value = "general";
    document.getElementById("noticeDate").value = "";
    document.getElementById("noticeLink").value = "";
    document.getElementById("noticeActive").checked = true;

    document.getElementById("formHeading").textContent =
      "Add New Notice";

    document.getElementById("cancelEditBtn")
      .classList.add("hidden");
  }


  // Activate / Deactivate
  async function toggleNotice(id, currentStatus) {

    const newStatus = !currentStatus;

    const { error } = await supabaseClient
      .from("notifications")
      .update({
        active: newStatus
      })
      .eq("id", id);


    if (error) {

      alert(
        "Status change नहीं हुआ: " +
        error.message
      );

      return;
    }


    loadNotices();
  }


  // Delete
  async function deleteNotice(id) {

    const confirmDelete =
      confirm(
        "क्या आप इस notice को permanently delete करना चाहते हैं?"
      );

    if (!confirmDelete) {
      return;
    }


    const { error } = await supabaseClient
      .from("notifications")
      .delete()
      .eq("id", id);


    if (error) {

      alert(
        "Delete नहीं हुआ: " +
        error.message
      );

      return;
    }


    loadNotices();
  }


  // Start
  checkLogin();

</script>

</body>
</html>
